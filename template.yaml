AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Haqdaar
  Backend for the Haqdaar application

Globals:
  Function:
    Timeout: 25
    MemorySize: 1024

Resources:
  # Sessions Table
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: haqdaar-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Lambda Function
  HaqdaarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ELIGIBILITY_ENGINE: !Ref EligibilityEngine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        ChatApi:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: post
        EligibilityApi:
          Type: HttpApi
          Properties:
            Path: /eligibility
            Method: post
        SchemesApi:
          Type: HttpApi
          Properties:
            Path: /schemes
            Method: get
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: get

Parameters:
  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-haiku-20240307-v1:0"
  EligibilityEngine:
    Type: String
    Default: "json"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
